<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Engineering systems in motion</title>
  <desc id="desc">A dark technical interface with animated data paths, orbiting nodes, and a pulsing system core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1b"/>
      <stop offset="1" stop-color="#11152b"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".5"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8ba3c7" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#grid)"/>
  <circle cx="600" cy="145" r="140" fill="url(#glow)"/>
  <g fill="none" stroke="#64748b" stroke-opacity=".45" stroke-width="1.5">
    <path d="M75 75H300L390 145H810L900 75H1125"/>
    <path d="M75 225H300L390 155H810L900 225H1125"/>
    <path d="M170 150H390M810 150H1030"/>
    <path d="M600 32V268" stroke-dasharray="3 9" opacity=".35"/>
  </g>
  <g fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round">
    <path d="M75 75H300L390 145H810L900 75H1125" stroke-dasharray="65 900">
      <animate attributeName="stroke-dashoffset" from="965" to="0" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M75 225H300L390 155H810L900 225H1125" stroke-dasharray="65 900">
      <animate attributeName="stroke-dashoffset" from="0" to="-965" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#22d3ee" filter="url(#softGlow)">
    <circle cx="170" cy="75" r="4"><animate attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="225" r="4"><animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="150" r="4"><animate attributeName="r" values="3;6;3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="150" r="4"><animate attributeName="r" values="6;3;6" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(600 150)">
    <circle r="76" fill="none" stroke="#8b5cf6" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="5 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
    </circle>
    <circle r="58" fill="none" stroke="#22d3ee" stroke-opacity=".55" stroke-width="2" stroke-dasharray="80 25 12 25">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="39" fill="#111b36" stroke="#a78bfa" stroke-width="1.5"/>
    <circle r="29" fill="#8b5cf6" opacity=".18">
      <animate attributeName="r" values="25;34;25" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".10;.32;.10" dur="3s" repeatCount="indefinite"/>
    </circle>
    <path d="M-13 0H13M0 -13V13" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round"/>
    <circle r="5" fill="#22d3ee" filter="url(#softGlow)"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="64" y="42" fill="#67e8f9" font-size="12" letter-spacing="3">SYSTEMS / DATA / INTELLIGENCE</text>
    <text x="64" y="275" fill="#94a3b8" font-size="11" letter-spacing="2">API LAYER  ·  RETRIEVAL  ·  PIPELINES</text>
    <text x="1136" y="42" text-anchor="end" fill="#a78bfa" font-size="12" letter-spacing="2">LIVE SIGNAL</text>
    <text x="1136" y="275" text-anchor="end" fill="#94a3b8" font-size="11" letter-spacing="2">ENGINEERING MODE</text>
  </g>
</svg>