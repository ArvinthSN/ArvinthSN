<svg width="1400" height="760" viewBox="0 0 1400 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1400" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="0.5" stop-color="#0A1123"/>
      <stop offset="1" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A855F7"/>
      <stop offset="1" stop-color="#00FFB3"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="760" fill="url(#bgGrad)"/>

  <g opacity="0.8">
    <circle cx="220" cy="100" r="140" fill="#A855F7" opacity="0.18" filter="url(#strongGlow)"/>
    <circle cx="1180" cy="150" r="170" fill="#00FFB3" opacity="0.12" filter="url(#strongGlow)"/>
    <circle cx="720" cy="420" r="260" fill="#00D4FF" opacity="0.1" filter="url(#strongGlow)"/>
  </g>

  <g opacity="0.7">
    <path d="M200 180C360 120 500 120 650 180C810 240 920 240 1180 180" stroke="url(#cyanGrad)" stroke-width="2" stroke-dasharray="10 10">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="12s" repeatCount="indefinite"/>
    </path>
    <path d="M200 560C320 500 430 500 560 560C700 620 860 620 1180 560" stroke="url(#violetGrad)" stroke-width="2" stroke-dasharray="12 12">
      <animate attributeName="stroke-dashoffset" values="0;120" dur="14s" repeatCount="indefinite"/>
    </path>
  </g>

  <g>
    <ellipse cx="700" cy="375" rx="340" ry="200" stroke="url(#violetGrad)" stroke-width="2" fill="none" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0 700 375" to="360 700 375" dur="26s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="700" cy="375" rx="250" ry="135" stroke="url(#cyanGrad)" stroke-width="2" fill="none" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="360 700 375" to="0 700 375" dur="18s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g filter="url(#softGlow)">
    <circle cx="700" cy="375" r="8" fill="#00FFB3"/>
    <circle cx="430" cy="240" r="6" fill="#00D4FF"/>
    <circle cx="980" cy="220" r="6" fill="#A855F7"/>
    <circle cx="1050" cy="500" r="7" fill="#00FFB3"/>
    <circle cx="380" cy="530" r="6" fill="#00D4FF"/>
    <circle cx="1040" cy="310" r="5" fill="#A855F7"/>
  </g>

  <g opacity="0.9">
    <g transform="translate(450 120)">
      <rect x="0" y="0" width="160" height="64" rx="18" fill="rgba(255,255,255,0.04)" stroke="#A855F7" stroke-width="1.5"/>
      <text x="28" y="39" font-size="27" font-family="Segoe UI, sans-serif" fill="#A855F7" font-weight="700">AI</text>
      <animateTransform attributeName="transform" type="translate" values="450 120; 470 100; 450 120" dur="8s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(1010 150)">
      <rect x="0" y="0" width="180" height="64" rx="18" fill="rgba(255,255,255,0.04)" stroke="#00FFB3" stroke-width="1.5"/>
      <text x="28" y="40" font-size="24" font-family="Segoe UI, sans-serif" fill="#00FFB3" font-weight="700">RAG</text>
      <animateTransform attributeName="transform" type="translate" values="1010 150; 1030 130; 1010 150" dur="9s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(170 430)">
      <rect x="0" y="0" width="170" height="66" rx="18" fill="rgba(255,255,255,0.04)" stroke="#00D4FF" stroke-width="1.5"/>
      <text x="26" y="42" font-size="24" font-family="Segoe UI, sans-serif" fill="#00D4FF" font-weight="700">SQL</text>
      <animateTransform attributeName="transform" type="translate" values="170 430; 190 410; 170 430" dur="10s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(1080 440)">
      <rect x="0" y="0" width="180" height="66" rx="18" fill="rgba(255,255,255,0.04)" stroke="#A855F7" stroke-width="1.5"/>
      <text x="30" y="42" font-size="24" font-family="Segoe UI, sans-serif" fill="#A855F7" font-weight="700">NODE</text>
      <animateTransform attributeName="transform" type="translate" values="1080 440; 1060 420; 1080 440" dur="11s" repeatCount="indefinite"/>
    </g>
  </g>

  <g opacity="0.8" font-family="Segoe UI, sans-serif" fill="#A855F7" font-size="12" font-weight="600">
    <text x="180" y="240">Python</text>
    <text x="1120" y="610">FastAPI</text>
    <text x="1180" y="290">React</text>
    <text x="200" y="620">Java</text>
  </g>

  <g opacity="0.3">
    <path d="M0 680L1400 680" stroke="#00FFB3" stroke-width="1"/>
    <path d="M0 700L1400 700" stroke="#00D4FF" stroke-width="1"/>
  </g>

  <g opacity="0.22">
    <g>
      <rect x="90" y="110" width="4" height="4" fill="#00FFB3"/>
      <rect x="140" y="160" width="4" height="4" fill="#00D4FF"/>
      <rect x="220" y="130" width="4" height="4" fill="#A855F7"/>
      <rect x="250" y="200" width="4" height="4" fill="#00FFB3"/>
      <rect x="1120" y="90" width="4" height="4" fill="#00FFB3"/>
      <rect x="1200" y="210" width="4" height="4" fill="#00D4FF"/>
      <rect x="1280" y="160" width="4" height="4" fill="#A855F7"/>
      <rect x="1240" y="90" width="4" height="4" fill="#00FFB3"/>
      <rect x="960" y="620" width="4" height="4" fill="#00D4FF"/>
      <rect x="1160" y="660" width="4" height="4" fill="#A855F7"/>
      <rect x="215" y="660" width="4" height="4" fill="#00FFB3"/>
      <rect x="300" y="620" width="4" height="4" fill="#00D4FF"/>
    </g>
  </g>
</svg>
