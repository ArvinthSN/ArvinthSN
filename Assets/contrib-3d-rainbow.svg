<svg width="1000" height="340" viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1000" height="340" rx="18" fill="#07050f"/>
  <g transform="translate(40,20)">
    <g opacity="0.95">
      <rect x="20" y="20" width="920" height="300" rx="14" fill="none" stroke="url(#g)" stroke-width="2"/>
      <g transform="translate(40,40)">
        <!-- stylized 3D blocks representing weeks -->
        <g>
          <!-- generate columns -->
            <!-- columns: 52 weeks x 7 days grid of rounded rects with neon gradient and subtle 3D offset -->
            <!-- We'll render a simplified pattern for static README use -->
            <g id="grid">
              <!-- small sample pattern -->
              <!-- week 1 -->
              <g transform="translate(0,0)">
                <rect x="0" y="0" width="12" height="12" rx="2" fill="#0f172a" stroke="url(#g)" stroke-width="1"/>
                <rect x="16" y="0" width="12" height="12" rx="2" fill="#111827" stroke="#0d1220"/>
              </g>
              <!-- repeated columns generated by the user or script can replace this block -->
              <g transform="translate(0,18)">
                <rect x="0" y="0" width="12" height="12" rx="2" fill="#07202a" stroke="#08202a"/>
                <rect x="16" y="0" width="12" height="12" rx="2" fill="#0b1420" stroke="#08202a"/>
              </g>
            </g>
        </g>
      </g>
    </g>
  </g>
  <text x="500" y="30" text-anchor="middle" fill="#a855f7" font-size="14" font-weight="700">Contribution Galaxy — Arvinth S.N.</text>
</svg>